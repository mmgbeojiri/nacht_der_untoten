<html>
  <head>
    <script src="https://aframe.io/releases/1.8.0/aframe.min.js"></script>
  </head>
  <body>
    <div id="display" z-index="1" style="position: absolute; top: 10px; left: 10px; color: white; font-size: 18px;"></div>
    <a-scene>
      <div id="floor"></div>
      <!--<a-entity camera position="0 40 -10" rotation="-90 0 0"></a-entity> -->
      <a-plane src="Nacht_der_untoten1.webp" position="0 -0.1 -8" rotation="-90 90 0" width="64" height="36"></a-plane>
      <!--Pillars-->
      <a-box position="-4.5 2 -8" rotation="0 0 0" height="4" color="#706b68" width="1.5" depth="1.5"></a-box>
      <a-box position="-8.5 2 -8" rotation="0 0 0" height="4" color="#706b68" width="1.5" depth="1.5"></a-box>
      <a-box position="-13 2 -8" rotation="0 0 0" height="4" color="#706b68" width="1.5" depth="1.5"></a-box>

      <a-box position="-4.5 2 -3.5" rotation="0 0 0" height="4" color="#706b68" width="1.5" depth="1.5"></a-box>
      <a-box position="-8.5 2 -3.5" rotation="0 0 0" height="4" color="#706b68" width="1.5" depth="1.5"></a-box>
      <a-box position="-13 2 -3.5" rotation="0 0 0" height="4" color="#706b68" width="1.5" depth="1.5"></a-box>

      <!--Pillars - Hallway -->
      <a-box position="-9 2 -19.5" rotation="0 0 0" height="4" color="#706b68" width="2.5" depth="2.5"></a-box>
    <a-box position="-3 2 -19.5" rotation="0 0 0" height="4" color="#706b68" width="2.5" depth="2.5"></a-box>
 <a-box position="3 2 -19.5" rotation="0 0 0" height="4" color="#706b68" width="2.5" depth="2.5"></a-box>
    <a-box position="9 2 -19.5" rotation="0 0 0" height="4" color="#706b68" width="2.5" depth="2.5"></a-box>

    <!-- Walls -->
    <a-box position="-1 2 -4" rotation="0 0 0" height="4" color="#706b68" width="1" depth="19"></a-box>
    <a-box position="-16 2 -2" rotation="0 0 0" height="4" color="#706b68" width="1" depth="16"></a-box>
    <a-box position="-15.5 2 11.5" rotation="0 0 0" height="4" color="#706b68" width="2" depth="4"></a-box>

    <a-box position="-11.5 2 18" rotation="0 0 0" height="4" color="#706b68" width="10" depth="1"></a-box>
    <a-box position="-2 2 18" rotation="0 0 0" height="4" color="#706b68" width="1" depth="1"></a-box>
    <a-box position="-1 2 13.5" rotation="0 0 0" height="4" color="#706b68" width="1" depth="10"></a-box>

    <a-box position="-4 2 12.5" rotation="0 0 0" height="4" color="#706b68" width="5" depth="0.5"></a-box>
    <a-box position="-13.5 2 12.5" rotation="0 0 0" height="4" color="#706b68" width="5" depth="0.5"></a-box>

    <!-- Walls - Hallway-->
    <a-box position="0 2 -14" rotation="0 0 0" height="4" color="#706b68" width="9" depth="1"></a-box>
    <a-box position="-12.25 2 -14" rotation="0 0 0" height="4" color="#706b68" width="6.5" depth="1"></a-box>
    <a-box position="-16 2 -22" rotation="0 0 0" height="4" color="#706b68" width="1" depth="17"></a-box>
    <a-box position="-9.5 2 -31" rotation="0 0 0" height="4" color="#706b68" width="14" depth="1"></a-box>
    <a-box position="-2 2 -28.5" rotation="0 0 0" height="4" color="#706b68" width="1" depth="6"></a-box>
    <a-box position="9.5 2 -26" rotation="0 0 0" height="4" color="#706b68" width="14" depth="1"></a-box>
    <a-box position="16 2 -17.5" rotation="0 0 0" height="4" color="#706b68" width="1" depth="8"></a-box>
    <a-box position="12 2 -14" rotation="0 0 0" height="4" color="#706b68" width="7" depth="1"></a-box>
    
    <!-- Windows demo-->
    <a-entity window="boards: 1" position="2 0 -6"></a-entity>
    <a-entity window="boards: 2" position="6 0 -6"></a-entity>
    <a-entity window="boards: 3" position="10 0 -6"></a-entity>
    <a-entity window="boards: 4; height: 3" position="14 0 -6" rotation="0 180 0" ></a-entity>
    
    <!-- Windows -->
     
    <a-entity window="boards: 3; width: 4" position="-16 0 8" rotation="0 90 0"></a-entity>
    <a-entity window="boards: 3; width: 4" position="-16 0 15.5" rotation="0 90 0"></a-entity>
    <a-entity window="boards: 3; width: 4" position="-4.5 0 18" rotation="0 180 0"></a-entity>
    <a-entity window="boards: 3; width: 5" position="-1 0 7" rotation="0 -90 0"></a-entity>

    <!-- Windows - Hallway -->
    <a-entity window="boards: 3; width: 4" position="6.5 0 -14" rotation="0 180 0"></a-entity>
    <a-entity window="boards: 3; width: 4" position="16 0 -23.5" rotation="0 -90 0"></a-entity>
    <a-entity window="boards: 3; width: 4" position="0.5 0 -26" rotation="0 0 0"></a-entity>

      <a-sky color="#ECECEC"></a-sky>
    </a-scene>
  </body>
  <script>
    AFRAME.registerComponent("window", {
      schema: {
        position: { type: "vec3", default: { x: 0, y: 0, z: 0 } },
        rotation: { type: "vec3", default: { x: 0, y: 0, z: 0 } },
        width: { type: "number", default: 4 },
        height: { type: "number", default: 4 },
        boards: { type: "number", default: 1 }
      },
      init: function() {
        //create window frame
        let bottomframe = document.createElement("a-box");
        bottomframe.setAttribute("position", `${this.data.position.x} ${this.data.position.y+0.5} ${this.data.position.z}`);
        bottomframe.setAttribute("rotation", `${this.data.rotation.x} ${this.data.rotation.y} ${this.data.rotation.z}`);
        bottomframe.setAttribute("width", this.data.width);
        bottomframe.setAttribute("height", 1);
        bottomframe.setAttribute("depth", 1);
        bottomframe.setAttribute("color", "#706b68");
        this.el.appendChild(bottomframe);

        let leftframe = document.createElement("a-box");
        leftframe.setAttribute("position", `${this.data.position.x - this.data.width / 2 + 0.5} ${this.data.position.y+2} ${this.data.position.z}`);
        leftframe.setAttribute("rotation", `${this.data.rotation.x} ${this.data.rotation.y} ${this.data.rotation.z}`);
        leftframe.setAttribute("width", 1);
        leftframe.setAttribute("height", 2);
        leftframe.setAttribute("depth", 1);
        leftframe.setAttribute("color", "#706b68");
        this.el.appendChild(leftframe);

        let rightframe = document.createElement("a-box");
        rightframe.setAttribute("position", `${this.data.position.x + this.data.width / 2 - 0.5} ${this.data.position.y+2} ${this.data.position.z}`);
        rightframe.setAttribute("rotation", `${this.data.rotation.x} ${this.data.rotation.y} ${this.data.rotation.z}`);
        rightframe.setAttribute("width", 1);
        rightframe.setAttribute("height", 2);
        rightframe.setAttribute("depth", 1);
        rightframe.setAttribute("color", "#706b68");
        this.el.appendChild(rightframe);

        let topframe = document.createElement("a-box");
        topframe.setAttribute("position", `${this.data.position.x} ${this.data.position.y+3.5} ${this.data.position.z}`);
        topframe.setAttribute("rotation", `${this.data.rotation.x} ${this.data.rotation.y} ${this.data.rotation.z}`);
        topframe.setAttribute("width", this.data.width);
        topframe.setAttribute("height", 1);
        topframe.setAttribute("depth", 1);
        topframe.setAttribute("color", "#706b68");
        this.el.appendChild(topframe);

        for (let i = 0; i < this.data.boards; i++) {
          let board = document.createElement("a-box");
          board.setAttribute("position", `${this.data.position.x} ${this.data.position.y+1.5+(((i+1)/this.data.boards)-(0.5/this.data.boards))} ${this.data.position.z+0.5}`);
          board.setAttribute("rotation", `${this.data.rotation.x} ${this.data.rotation.y} ${this.data.rotation.z+(Math.random()-0.5) * 20}`);
          board.setAttribute("width", this.data.width-2+0.5);
          board.setAttribute("height", 0.3);
          board.setAttribute("depth", 0.1);
          board.setAttribute("color", "#895129");
          this.el.appendChild(board);
        }
        
      },
  
    })

    const colors = ["#1b1a18","#26211e","#3b3331","#292522"];
    function tiles(xMin, xMax, zMin, zMax, height=0) {
      for (let x = xMin; x < xMax; x++) {
        for (let z = zMin; z < zMax; z++) {
          let tile = document.createElement("a-plane");
          tile.setAttribute("position", `${x} ${height} ${z}`);
          tile.setAttribute("rotation", "-90 0 0");
          tile.setAttribute("width", "1");
          tile.setAttribute("height", "1");
          tile.setAttribute("color", colors[Math.floor(Math.random() * colors.length)]);
          document.querySelector("a-scene").appendChild(tile);
        }
      }
    }
    tiles(-15, -1, -13, 10); // Main Room -- front
    tiles(-14, -1, 10, 14); // Main Room -- middle
    tiles(-15, -1, 14, 18); // Main Room -- back
    tiles(-15, 16, -25,-13); // Hallway
    tiles(-15, -2, -30,-25) // hallway -- 

  </script>
</html>
