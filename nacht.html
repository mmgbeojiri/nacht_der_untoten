<html>
  <head>
    <script src="https://aframe.io/releases/1.8.0/aframe.min.js"></script>
  </head>
  <body>
    <div id="display" z-index="1" style="position: absolute; top: 10px; left: 10px; color: white; font-size: 18px;"></div>
    <a-scene>
      <div id="floor"></div>
      <a-plane src="Nacht_der_untoten1.webp" position="0 0.1 -8" rotation="-90 90 0" width="64" height="36"></a-plane>
      <!--Pillars-->
      <a-box position="-4.5 2 -8" rotation="0 0 0" height="4" color="#706b68" width="1.5" depth="1.5"></a-box>
      <a-box position="-8.5 2 -8" rotation="0 0 0" height="4" color="#706b68" width="1.5" depth="1.5"></a-box>
      <a-box position="-13 2 -8" rotation="0 0 0" height="4" color="#706b68" width="1.5" depth="1.5"></a-box>

      <a-box position="-4.5 2 -3.5" rotation="0 0 0" height="4" color="#706b68" width="1.5" depth="1.5"></a-box>
      <a-box position="-8.5 2 -3.5" rotation="0 0 0" height="4" color="#706b68" width="1.5" depth="1.5"></a-box>
      <a-box position="-13 2 -3.5" rotation="0 0 0" height="4" color="#706b68" width="1.5" depth="1.5"></a-box>

      <!--Pillars - Hallway -->
      <a-box position="-9 2 -19.5" rotation="0 0 0" height="4" color="#706b68" width="2.5" depth="2.5"></a-box>
    <a-box position="-3 2 -19.5" rotation="0 0 0" height="4" color="#706b68" width="2.5" depth="2.5"></a-box>
 <a-box position="3 2 -19.5" rotation="0 0 0" height="4" color="#706b68" width="2.5" depth="2.5"></a-box>
    <a-box position="9 2 -19.5" rotation="0 0 0" height="4" color="#706b68" width="2.5" depth="2.5"></a-box>


      <a-sky color="#ECECEC"></a-sky>
    </a-scene>
  </body>
  <script>
    const colors = ["#1b1a18","#26211e","#3b3331","#292522"];
    function tiles(xMin, xMax, zMin, zMax) {
      for (let x = xMin; x < xMax; x++) {
        for (let z = zMin; z < zMax; z++) {
          let tile = document.createElement("a-plane");
          tile.setAttribute("position", `${x} 0 ${z}`);
          tile.setAttribute("rotation", "-90 0 0");
          tile.setAttribute("width", "1");
          tile.setAttribute("height", "1");
          tile.setAttribute("color", colors[Math.floor(Math.random() * colors.length)]);
          document.querySelector("a-scene").appendChild(tile);
        }
      }
    }
    tiles(-15, -1, -13, 18); // Main Room
    tiles(-15, 16, -25,-13); // Hallway

    console.log(JSON.stringify(document.querySelector('[camera]').object3D.position));
  </script>
</html>
