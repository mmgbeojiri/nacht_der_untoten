<html>
  <head>
    <script src="https://aframe.io/releases/1.8.0/aframe.min.js"></script>
  </head>
  <body>
    <div id="display" z-index="1" style="position: absolute; top: 10px; left: 10px; color: white; font-size: 18px;"></div>
   
    <a-scene keyboard-shortcuts="enterVR: false; exitVR: false;">

      <a-assets>
        <img id="grid"  src="grid.jpg"/>
        <img id="nacht1" src="Nacht_der_untoten1.webp"/>
        <img id="nacht2" src="Nacht_der_untoten2.webp"/>
      </a-assets>

      <a-plane opacity="0" src="#nacht1" position="0 -0.1 -8" rotation="-90 90 0" width="64" height="36"></a-plane>
    <a-plane opacity="0" src="#nacht2" position="0 4 -8" rotation="-90 90 0" width="64" height="36"></a-plane>
    <a-plane src="#grid" repeat="10 10" position="0 0 0" rotation="-90 0 0" width="100" height="100"></a-plane>
    <!--FirstFloorCam-->
    <a-entity camera active="true"  position="-8 1.6 -10"  look-controls="pointerLockEnabled: true" wasd-controls id="firstfloor">
      <a-text id="playerpos"
        value="" 
        position="-0.5 0.6 -1" 
        scale="0.3 0.3 0.3" 
        color="#FFFFFF"
        align="center">
      </a-text>
      <a-text value="" id="boardwindow"
        position="0 0.0 -1" 
        scale="0.2 0.2 0.2" 
        color="#FFFFFF"
        align="center">
      </a-text>
      <a-cursor geometry="primitive: circle; radius:0.005"
            material="color: white; shader: flat"></a-cursor>
    </a-entity>
    
    <!--TopFloorCam<a-entity camera active="false"  position="0 30 -10" wasd-controls rotation="-90 0 0" id="topfloor"></a-entity> 
  -->

    <a-box static-body position="-14.5 2 11" rotation="0 0 0" height="4" color="#3c3636" width="4" depth="3"></a-box>

    <a-entity window="boards: 6" position="24 0 -6"></a-entity>
    <a-entity window="boards: 7" position="28 0 -6"></a-entity>

    <a-cylinder  color="#000" position="-0.3 1.75 -2" radius="0.1" height="3.5"></a-cylinder>

    <a-box color="#3c3636" position="0 3.75 -2" width="1" height="0.5" depth="1"></a-box>

    <a-entity bars="width: 3" position="1 0 -2"></a-entity>

      <a-box static-body position="-16 4.5 -3.75" rotation="0 0 0" height="1" color="#3c3636" width="1" depth="20.5"></a-box>
      <a-box static-body position="-16 7.5 -3.75" rotation="0 0 0" height="1" color="#3c3636" width="1" depth="20.5"></a-box>
      <a-box static-body position="-1 6 -10.5" rotation="0 0 0" height="4" color="#3c3636" width="1" depth="10"></a-box>
